<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home | ORION Scholar</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body data-page="home">
<div id="top"></div><script src="site.js"></script>
<main class="wrap">
  <section class="hero"><h1 id="h-title"></h1><p id="h-sub"></p>
    <form id="hs"><input id="hq" type="search" placeholder="Search researchers, projects or handles" aria-label="Search"><button type="submit">Search</button></form></section>
  <div class="card banner"><span id="b-text"></span><a href="projects.html" id="b-cta"></a></div>
  <div class="grid3 sec" id="tiles"></div>
  <div class="cols">
    <div>
      <section class="sec"><h2>Featured projects</h2><div id="featured"></div></section>
      <section class="sec"><h2>Spotlight researchers</h2><div class="grid3" id="spot"></div></section>
    </div>
    <div>
      <section class="sec card rail"><h3>Latest updates</h3><ul class="feed" id="updates"></ul></section>
      <section class="sec card rail"><h3>Upcoming events</h3><div id="events"></div></section>
    </div>
  </div>
  <div class="card error" id="error" hidden></div>
</main>
<script>
loadData().then(function(d){
  var h=d.home,pj=d.projects,cs=d.collaborators;
  document.getElementById('h-title').textContent=h.hero.title;document.getElementById('h-sub').textContent=h.hero.subtitle;
  document.getElementById('b-text').textContent=h.banner.text;document.getElementById('b-cta').textContent=h.banner.cta+' →';
  document.getElementById('hs').onsubmit=function(e){e.preventDefault();location.href='index.html?q='+encodeURIComponent(document.getElementById('hq').value)};
  var tl=document.getElementById('tiles');
  [[cs.length,'Researchers'],[pj.filter(function(p){return p.status==='Open'}).length,'Open projects'],[cs.reduce(function(a,c){return a+(c.publications||0)},0),'Publications']].forEach(function(t){var d=el('div','card tile');d.appendChild(el('b','',t[0]));d.appendChild(el('span','',t[1]));tl.appendChild(d)});
  var f=document.getElementById('featured');
  h.featured_project_ids.forEach(function(id){var p=pj.filter(function(x){return x.id===id})[0];if(!p)return;
    var c=el('div','card pc');c.appendChild(el('h2','',p.title));
    var m=el('div','meta');m.appendChild(el('span','st '+p.status,p.status));m.appendChild(el('span','',p.department+' · '+p.project_type));m.appendChild(el('span','',p.instructor));c.appendChild(m);
    c.appendChild(el('p','',p.description));f.appendChild(c)});
  var sp=document.getElementById('spot');
  h.spotlight_ids.forEach(function(id){var c=cs.filter(function(x){return x.id===id})[0];if(!c)return;
    var d=el('div','card mini');var a=el('a','',c.name);a.href=c.portfolio_url||'index.html?q='+encodeURIComponent(c.name);if(c.portfolio_url)a.target='_blank';
    var t=el('h3');t.appendChild(a);d.appendChild(t);d.appendChild(el('div','sub',c.role));d.appendChild(el('div','sub',c.affiliation));d.appendChild(el('p','',c.interests?c.interests.slice(0,2).join(' · '):c.bio));sp.appendChild(d)});
  var u=document.getElementById('updates');
  h.updates.forEach(function(x){var li=el('li');var b=el('b','',x.title);li.appendChild(b);li.appendChild(el('br'));li.appendChild(el('small','',fmtDate(x.date)+' · '+x.tag));li.appendChild(el('p','',x.body));u.appendChild(li)});
  var ev=document.getElementById('events');
  h.events.forEach(function(x){var d=new Date(x.date+'T00:00:00');var row=el('div','ev');var dt=el('div','date');dt.appendChild(el('b','',d.getDate()));dt.appendChild(el('span','',d.toLocaleDateString('en-GB',{month:'short'})));row.appendChild(dt);
    var t=el('div');t.appendChild(el('b','',x.title));t.appendChild(el('div','sub',x.place+' · '+x.time));row.appendChild(t);ev.appendChild(row)});
}).catch(function(e){var er=document.getElementById('error');er.hidden=false;er.textContent='Could not load page data ('+e.message+'). Serve this folder over HTTP and check data.json is present.'});
</script></body></html>
